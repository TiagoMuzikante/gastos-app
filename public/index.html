<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gastos</title>
  <meta name="description" content="Aplicação simples para registrar e monitorar gastos pessoais por categoria e mês." />

  <!-- Bootstrap CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />

  <style>
    body {
      background-color: #f0f2f5;
    }
    .card {
      border-radius: 12px;
    }
    .table th {
      background-color: #0d6efd;
      color: white;
    }
    h1 {
      font-weight: 700;
      color: #0d6efd;
    }
    .badge-categoria {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <h1 class="mb-4 text-center">💰 Controle de Gastos</h1>

    <!-- Formulário de Registro -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white fw-bold">
        Registrar Gasto
      </div>
      <div class="card-body">
        <form id="formGasto">
          <div class="row g-3">

            <div class="col-md-4">
              <label for="nome" class="form-label">Nome / Descrição</label>
              <input
                type="text"
                class="form-control"
                id="nome"
                placeholder="Ex: Aluguel, Mercado..."
                required
              />
            </div>

            <div class="col-md-3">
              <label for="data" class="form-label">Data</label>
              <input
                type="date"
                class="form-control"
                id="data"
                required
              />
            </div>

            <div class="col-md-3">
              <label for="categoria" class="form-label">Categoria</label>
              <select class="form-select" id="categoria" required>
                <option value="">Selecione...</option>
                <option value="Alimentação">Alimentação</option>
                <option value="Moradia">Moradia</option>
                <option value="Transporte">Transporte</option>
                <option value="Saúde">Saúde</option>
                <option value="Educação">Educação</option>
                <option value="Lazer">Lazer</option>
                <option value="Vestuário">Vestuário</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <div class="col-md-2">
              <label for="valor" class="form-label">Valor (R$)</label>
              <input
                type="number"
                class="form-control"
                id="valor"
                placeholder="0,00"
                step="0.01"
                min="0.01"
                required
              />
            </div>

          </div>

          <div class="mt-3 text-end">
            <button type="submit" class="btn btn-primary px-4">
              ➕ Registrar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Filtro de Resumo -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-secondary text-white fw-bold">
        📊 Resumo de Gastos
      </div>
      <div class="card-body">
        <div class="row g-2 align-items-end mb-3">
          <div class="col-md-4">
            <label for="filtroMes" class="form-label">Filtrar por Mês</label>
            <input
              type="month"
              class="form-control"
              id="filtroMes"
            />
          </div>
          <div class="col-md-3">
            <button class="btn btn-secondary w-100" id="btnFiltrar">
              🔍 Filtrar
            </button>
          </div>
          <div class="col-md-3">
            <button class="btn btn-outline-secondary w-100" id="btnLimparFiltro">
              ✖ Limpar Filtro
            </button>
          </div>
        </div>

        <!-- Totais por Categoria -->
        <div id="resumoCategorias" class="mb-4"></div>

        <!-- Tabela de Gastos -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle">
            <thead>
              <tr>
                <th>#</th>
                <th>Nome</th>
                <th>Data</th>
                <th>Categoria</th>
                <th>Valor</th>
              </tr>
            </thead>
            <tbody id="tabelaGastos">
              <tr>
                <td colspan="5" class="text-center text-muted">
                  Nenhum gasto registrado ainda.
                </td>
              </tr>
            </tbody>
            <tfoot>
              <tr class="table-primary fw-bold">
                <td colspan="4" class="text-end">Total:</td>
                <td id="totalGeral">R$ 0,00</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>
    </div>

  </div><!-- /container -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
